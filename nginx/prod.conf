# Edge reverse proxy: routes /api and /admin to gunicorn, everything else to the
# frontend container, and serves collected static/media directly (plan §8).
#
# TLS: place cert.pem/key.pem in ./nginx/certs and uncomment the 443 server
# block below (e.g. via certbot or your platform's managed TLS). The 80 block
# alone is enough to boot the stack behind a TLS-terminating load balancer.

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz/ {
        proxy_pass http://backend_upstream;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}

